<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #020617;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: 100px;
            margin: 0;
            position: relative;
            color: #38bdf8;
        }

        /* Glitch effect */
        h1::before,
        h1::after {
            content: "404";
            position: absolute;
            left: 0;
        }

        h1::before {
            color: #f43f5e;
            animation: glitchTop 1s infinite;
        }

        h1::after {
            color: #22c55e;
            animation: glitchBottom 1s infinite;
        }

        @keyframes glitchTop {
            0% { transform: translate(0); }
            20% { transform: translate(-3px, -3px); }
            40% { transform: translate(-3px, 3px); }
            60% { transform: translate(3px, -3px); }
            80% { transform: translate(3px, 3px); }
            100% { transform: translate(0); }
        }

        @keyframes glitchBottom {
            0% { transform: translate(0); }
            20% { transform: translate(3px, 3px); }
            40% { transform: translate(3px, -3px); }
            60% { transform: translate(-3px, 3px); }
            80% { transform: translate(-3px, -3px); }
            100% { transform: translate(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        p {
            margin: 15px 0;
            font-size: 18px;
            opacity: 0.8;
        }

        a {
            display: inline-block;
            padding: 12px 25px;
            background: #38bdf8;
            color: #000;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        a:hover {
            background: #0ea5e9;
            transform: scale(1.1);
        }

        /* Background animated dots */
        .bg span {
            position: absolute;
            display: block;
            width: 5px;
            height: 5px;
            background: #38bdf8;
            animation: move 10s linear infinite;
            opacity: 0.3;
        }

        @keyframes move {
            from {
                transform: translateY(100vh);
            }
            to {
                transform: translateY(-10vh);
            }
        }
    </style>
</head>

<body>

    <div class="bg">
        <!-- generate multiple dots -->
        <span style="left:10%; animation-duration:8s;"></span>
        <span style="left:20%; animation-duration:12s;"></span>
        <span style="left:30%; animation-duration:10s;"></span>
        <span style="left:40%; animation-duration:7s;"></span>
        <span style="left:50%; animation-duration:11s;"></span>
        <span style="left:60%; animation-duration:9s;"></span>
        <span style="left:70%; animation-duration:13s;"></span>
        <span style="left:80%; animation-duration:6s;"></span>
        <span style="left:90%; animation-duration:14s;"></span>
    </div>

    <div class="container">
        <h1>404</h1>
        <p>Page not found. It might have been removed or doesn't exist.</p>
        <a href="/">Go Home</a>
    </div>

</body>
</html>
